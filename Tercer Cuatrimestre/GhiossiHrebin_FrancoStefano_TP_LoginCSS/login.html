<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Store</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-container">
        <h1 class="login-title">Food Store</h1>
        <h2 class="login-subtitle">Iniciar Sesión</h2>

        <form action="#" method="POST" class="login-form">
            <div class="input-group">
                <!-- Se utiliza el atributo for para vincular el label al input -->
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
            </div>

            <button type="submit" class="login-btn">Ingresar</button>
        </form>

        <div class="login-footer">
            <a href="#">¿No tenés cuenta? Registrate acá</a>
        </div>
    </main>
</body>
</html>
